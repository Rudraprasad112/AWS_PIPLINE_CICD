Go to IAM → Users → Temp_user → Permissions.

Attach a policy that allows Lambda actions, e.g. AWSLambda_FullAccess or a custom policy:

{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Action": [
        "lambda:*"
      ],
      "Resource": "*"
    }
  ]
}
👉 Without this, your Action cannot deploy to Lambda.

