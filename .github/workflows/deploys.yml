You said:
create a branch in github using cli
ChatGPT said:
To create a branch in GitHub using CLI, you actually use Git CLI (not GitHub CLI).
Here are the steps:

First, check your current branch:

git branch
Create a new branch (example: feature-1):

git branch feature-1
Switch to that branch:

git checkout feature-1
👉 Or you can do both in one command:

git checkout -b feature-1
Push the branch to GitHub:

git push -u origin feature-1
✨ Now your new branch feature-1 exists in both local and GitHub remote.

