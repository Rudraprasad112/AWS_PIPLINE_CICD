ChatGPT said:
That error comes when your GitHub Actions workflow YAML file has no on: block (which tells when the workflow should run).

Here’s a simple example workflow (.github/workflows/ci.yml):

name: CI Pipeline

on:                # 👈 event triggers
  push:            # run on every push
    branches:
      - main
      - test
  pull_request:    # run on pull requests
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
Explanation in very easy words:
on: → tells GitHub when to run (push, pull_request, etc.).

jobs: → group of tasks.

steps: → actions/commands inside a job.

👉 In your case, error came because you missed this part:

on:
  push:
    branches:
      - main
