name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-venv python3-pip jq zip
          pip3 install boto3

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "API_KEY=prod_api_key" >> $GITHUB_ENV
            echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
          else
            echo "ENV=test" >> $GITHUB_ENV
            echo "API_KEY=test_api_key" >> $GITHUB_ENV
            echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          fi

      - name: Package lambda function
        run: |
          cd lambda_function
          python3.11 -m venv myenv
          source myenv/bin/activate
          mkdir package
          pip install --no-cache-dir -r requirements.txt -t ./package
          cp app.py ./package/
          cd package
          zip -r ../../lambda.zip .
          cd ../..

      - name: Deploy to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        run: |
          function_name="cicd_lambda_${{ github.ref_name }}"
          region="eu-north-1"
          echo "Deploying to lambda function: $function_name"

          # Check if function exists
          if ! aws lambda get-function --function-name $function_name --region $region > /dev/null 2>&1; then
            echo "Creating new function $function_name..."
            aws lambda create-function \
              --function-name $function_name \
              --runtime python3.11 \
              --role arn:aws:iam::503015902968:role/CICD_PIPLINE \
              --handler app.lambda_handler \
              --timeout 300 \
              --zip-file fileb://lambda.zip \
              --region $region \
              --environment "Variables={ENV=$ENV,API_KEY=$API_KEY,LOG_LEVEL=$LOG_LEVEL}"
          else
            echo "Updating function $function_name..."
            aws lambda update-function-code \
              --function-name $function_name \
              --region $region \
              --zip-file fileb://lambda.zip

            echo "Waiting for update..."
            while true; do
              Updated_status=$(aws lambda get-function --function-name $function_name --region $region --query 'Configuration.LastUpdateStatus' --output text)
              if [[ "$Updated_status" == "Successful" ]]; then
                echo "Update successful!"
                break
              elif [[ "$Updated_status" == "Failed" ]]; then
                echo "Function code update failed."
                exit 1
              else
                echo "Update in progress, waiting..."
                sleep 5
              fi
            done

            aws lambda update-function-configuration \
              --function-name $function_name \
              --region $region \
              --environment "Variables={ENV=$ENV,API_KEY=$API_KEY,LOG_LEVEL=$LOG_LEVEL}"
          fi
